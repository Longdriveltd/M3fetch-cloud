name: M3Fetch Cloud Runner

# 触发方式:
#  1) 定时: 每 5 分钟 (GitHub 免费公开仓库 Actions 分钟无限)
#  2) 手动: Actions 页点 "Run workflow" (验证时先用这个)
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: m3fetch-cloud
  cancel-in-progress: false   # 不取消正在下载的任务, 排队等下一轮

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip -q
          pip install -q requests yt-dlp imageio-ffmpeg boto3
          # 系统 ffmpeg 作为兜底 (imageio-ffmpeg 自带一份)
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg || true

      - name: Run cloud runner
        env:
          API_BASE: ${{ secrets.API_BASE }}
          AGENT_TOKEN: ${{ secrets.AGENT_TOKEN }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE: ${{ secrets.R2_PUBLIC_BASE }}
        run: python cloud_runner.py
