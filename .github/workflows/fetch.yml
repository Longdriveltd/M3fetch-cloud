name: M3Fetch Cloud Runner

# 触发方式:
#  1) 定时: 每 5 分钟 (GitHub 免费公开仓库 Actions 分钟无限)
#  2) 手动: Actions 页点 "Run workflow" (验证时先用这个)
# 存储: GitHub Releases (无 R2, 无绑卡). token 由 GitHub 自动注入.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: m3fetch-cloud
  cancel-in-progress: false   # 不取消正在下载的任务, 排队等下一轮

# 上传 Release asset 需要写权限
permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip -q
          # imageio-ffmpeg 自带 ffmpeg 二进制, vfetch 的 find_ffmpeg() 优先用它,
          # 无需 apt 装系统 ffmpeg (apt update+install 每次冷启动要多花 1-3 分钟).
          pip install -q requests yt-dlp imageio-ffmpeg

      - name: Run cloud runner
        env:
          API_BASE: ${{ secrets.API_BASE }}
          AGENT_TOKEN: ${{ secrets.AGENT_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python cloud_runner.py
